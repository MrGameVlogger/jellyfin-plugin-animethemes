name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: "net10.0"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.jprm.outputs.artifact }}

  upload:
    if: ${{ github.event_name == 'release' }}
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact

      - name: Prepare GH Release Assets
        run: |-
          for file in ./*; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l

      - name: Upload GH Release Assets
        uses: shogo82148/actions-upload-release-asset@9ee13965a8a51926f330b424693f25fcff8f2ef6 # v1.10.6
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*

  update-manifest:
    if: ${{ github.event_name == 'release' }}
    needs:
      - upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact
          path: dist

      - name: Update manifest.json
        run: |-
          python3 -m pip install --user jprm==1.1.0
          tag="${{ github.event.release.tag_name }}"
          for zip in dist/*.zip; do
            name="$(basename "$zip")"
            python3 -m jprm repo add ./manifest.json "$zip" \
              --plugin-url "https://github.com/${{ github.repository }}/releases/download/${tag}/${name}"
          done

      - name: Open manifest update PR
        run: |-
          if git diff --quiet manifest.json; then
            echo "manifest.json unchanged"
            exit 0
          fi
          tag="${{ github.event.release.tag_name }}"
          branch="chore/manifest-${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add manifest.json
          git commit -m "chore: update manifest for release ${tag}"
          git push --force -u origin "$branch"
          open="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "PR for ${branch} already open"
            exit 0
          fi
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "chore: update manifest for release ${tag}" \
            --body "Automated \`manifest.json\` update for release \`${tag}\` (checksum + newest-first entry, built by \`jprm repo add\`). Merge to publish the version to the plugin repository."
        env:
          GH_TOKEN: ${{ github.token }}
