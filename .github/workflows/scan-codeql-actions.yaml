name: '🔬 Run CodeQL (Actions & JS)'

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '**/*.js'
      - 'Jellyfin.Plugin.AnimeThemes/Configuration/configPage.html'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '**/*.js'
      - 'Jellyfin.Plugin.AnimeThemes/Configuration/configPage.html'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions', 'javascript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
